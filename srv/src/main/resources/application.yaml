
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
cds:
  data-source.auto-config.enabled: false
  security:
    authorization:
      authenticateUnknownEndpoints: false
      ams:
        test-sources: ""
    mock.users:
      alice:
        roles: [ support ]
      bob:
        roles: [ admin ]
---
spring:
  config.activate.on-profile: cloud
logging:
  level:
    com.sap.cloud.security: DEBUG
    org.springframework.security: DEBUG
---
management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
