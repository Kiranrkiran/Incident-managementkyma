_schema-version: '1.0'
repository: docker.io/kiranryadav
tag: v6
before-all:
  - mvn clean package -DskipTests=true --batch-mode
modules:
  - name: incident-management-srv
    build-parameters:
      buildpack:
        builder: builder-jammy-base
        path: srv/target/incident-management-exec.jar
        env:
          SPRING_PROFILES_ACTIVE: cloud
          BP_JVM_VERSION: 25
  - name: incident-management-hana-deployer
    build-parameters:
      buildpack:
        type: nodejs
        builder: builder-jammy-base
        path: db
        env:
          BP_NODE_RUN_SCRIPTS: ""
  - name: incident-management-html5-deployer
    build-parameters:
      buildpack:
        type: sapse/application-content-deployer-buildpack:1.4.0
        builder: builder-jammy-base
        path: app/html5-deployer
